name: AI Signal daily issue

# Every morning around 10:00 Beijing time: collect sources, let DeepSeek edit the issue, email it,
# then publish the web edition (docs/) and the sent-items list (data/seen.json).
# The daily commit also keeps this scheduled workflow from being paused for inactivity.
#
# Timing: GitHub queues schedules on the hour heavily. With '0 2 * * *' the issue went out at
# 15:23 Beijing (2026-10-20 and 10-21). So the schedule sits off the hour, with two backups.
# Whichever run starts first sends the issue; the later ones see today's archive page and stop.

on:
  schedule:
    - cron: '41 1 * * *' # 09:41 Beijing
    - cron: '17 2 * * *' # 10:17 Beijing, backup
    - cron: '17 4 * * *' # 12:17 Beijing, last backup
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A scheduled run stops here if today's issue is already out. A manual run always sends.
      - name: Already sent today?
        id: today
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/archive/$(TZ=Asia/Shanghai date +%F).html" ]; then
            echo "Today's issue is already out."
            echo "sent=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.today.outputs.sent != 'true'
        with:
          node-version: '22'

      - name: Install
        if: steps.today.outputs.sent != 'true'
        run: cd scripts && npm ci --no-audit --no-fund

      - name: Configure
        if: steps.today.outputs.sent != 'true'
        run: |
          mkdir -p ~/.ai-signal/drafts
          {
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}"
            echo "DEEPSEEK_MODEL=deepseek-chat"
            echo "QQ_EMAIL=${{ secrets.QQ_EMAIL }}"
            echo "QQ_SMTP_AUTH=${{ secrets.QQ_SMTP_AUTH }}"
          } > ~/.ai-signal/.env
          echo '${{ secrets.AI_SIGNAL_CONFIG }}' > ~/.ai-signal/config.json

      - name: Collect sources
        if: steps.today.outputs.sent != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd scripts && node prepare-digest.js --seen ../data/seen.json --out ~/.ai-signal/drafts/feed.json

      - name: Edit the issue
        if: steps.today.outputs.sent != 'true'
        run: cd scripts && node remix-digest.js --file ~/.ai-signal/drafts/feed.json --out ~/.ai-signal/drafts/email.html --json-out ~/.ai-signal/drafts/issue.json --web-dir ../docs --seen ../data/seen.json

      - name: Send
        if: steps.today.outputs.sent != 'true'
        run: cd scripts && node deliver.js --file ~/.ai-signal/drafts/email.html --force

      - name: Publish the web edition
        if: steps.today.outputs.sent != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "AI Signal $(TZ=Asia/Shanghai date +%F)"
          git push
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true

      - name: Keep the drafts for debugging
        if: always() && steps.today.outputs.sent != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: issue-${{ github.run_id }}
          path: ~/.ai-signal/drafts/
          retention-days: 14
