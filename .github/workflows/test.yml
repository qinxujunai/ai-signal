name: Test

on:
  push:
    paths: ['scripts/**', '.github/workflows/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd scripts && npm ci --no-audit --no-fund && npm test
