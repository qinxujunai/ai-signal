name: relay test (temporary)

# Throwaway rehearsal of the relay chain on a stand-in for daily.yml: the real scripts/relay.js, a 2-minute environment.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'relay' && format('relay for {0}', inputs.for_day) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [now, relay]
        default: now
      wake:
        type: string
        default: ''
      for_day:
        type: string
        default: ''
      hold:
        type: string
        default: '0'

permissions:
  contents: read
  actions: write

jobs:
  wake:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'relay' && inputs.wake != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.wake }}
    steps:
      - run: echo "The alarm went off, for ${{ inputs.for_day }}."
  main:
    needs: wake
    if: ${{ !cancelled() && (needs.wake.result == 'success' || needs.wake.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: relay-test-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set tomorrow's alarm (as daily.yml does)
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_WORKFLOW: relay-test.yml
          RELAY_WAKE: relay-test-2m
          MODE: ${{ inputs.mode }}
          FOR_DAY: ${{ inputs.for_day }}
        run: node scripts/relay.js arm --issue-out true --mode "$MODE" --for-day "$FOR_DAY" --now 2026-11-07T10:05:00+08:00
