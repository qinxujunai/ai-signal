name: Release

# Pushing a tag vX.Y.Z publishes a GitHub Release whose notes are that version's CHANGELOG section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { if (found) exit; if (index($0, "## " tag " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "AI Signal ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
